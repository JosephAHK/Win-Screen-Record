<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recording</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
      border-radius: 8px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      padding: 10px 8px;
    }

    /* Pulsing red dot to indicate recording */
    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #ccc;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e53935;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }

    /* Timer display */
    #timer {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #eee;
    }

    /* Audio meter — horizontal bar */
    .audio-section {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 0 6px;
    }

    #micBtn {
      width: 26px;
      height: 26px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #micBtn:hover { background: rgba(255,255,255,0.1); }

    #micBtn svg { width: 18px; height: 18px; }

    .meter-track {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4caf50, #8bc34a, #ffeb3b, #ff9800, #f44336);
      transition: width 0.08s linear;
    }

    .meter-fill.muted {
      background: #555;
    }

    /* Stop button */
    #stopBtn {
      width: 64px;
      height: 32px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #stopBtn:hover { background: #c62828; }
    #stopBtn:active { background: #b71c1c; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="rec-indicator">
      <div class="dot"></div>
      <span>REC</span>
    </div>
    <div id="timer">00:00</div>

    <!-- Mic toggle + audio level meter -->
    <div class="audio-section">
      <button id="micBtn" title="Toggle microphone">
        <!-- Mic ON icon (default) -->
        <svg id="micOn" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <!-- Mic OFF icon (hidden) -->
        <svg id="micOff" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill"></div>
      </div>
    </div>

    <button id="stopBtn">Stop</button>
  </div>
  <script src="controls.js"></script>
</body>
</html>
