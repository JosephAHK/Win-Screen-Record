<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recording</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
      border-radius: 8px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      padding: 12px 8px;
    }

    /* Pulsing red dot to indicate recording */
    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #ccc;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e53935;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }

    /* Timer display */
    #timer {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #eee;
    }

    /* Stop button */
    #stopBtn {
      width: 64px;
      height: 32px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #stopBtn:hover {
      background: #c62828;
    }

    #stopBtn:active {
      background: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="rec-indicator">
      <div class="dot"></div>
      <span>REC</span>
    </div>
    <div id="timer">00:00</div>
    <button id="stopBtn">Stop</button>
  </div>
  <script src="controls.js"></script>
</body>
</html>
