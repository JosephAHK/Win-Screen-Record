<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recording</title>
  <style>
    :root {
      --bg: #141922;
      --bg-elevated: #1c2330;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --accent-press: #be123c;
      --mic: #34d399;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 16px 32px rgba(0, 0, 0, 0.32);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      gap: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 28%),
        var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .drag {
      -webkit-app-region: drag;
      display: flex;
      justify-content: center;
      padding-bottom: 4px;
    }

    .drag-grip {
      width: 32px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .status {
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      justify-content: center;
    }

    .ready-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.18);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.86); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }

    #timer {
      font-size: 28px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: var(--text);
    }

    .audio-card {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      padding: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .mic-picker {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mic-select-wrap {
      position: relative;
    }

    .mic-select-wrap::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--text-muted);
      border-bottom: 1.5px solid var(--text-muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    #micSelect {
      width: 100%;
      height: 28px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      padding: 0 22px 0 8px;
      cursor: pointer;
    }

    #micSelect:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }

    #micSelect:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    #micSelect:disabled {
      cursor: default;
      opacity: 0.7;
    }

    #micSelect option {
      background: #1c2330;
      color: var(--text);
    }

    #micBtn {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
    }

    #micBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }

    #micBtn:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    #micBtn svg { width: 16px; height: 16px; }

    .meter {
      flex: 1;
      display: flex;
      gap: 2px;
      height: 10px;
      align-items: stretch;
    }

    .meter-seg {
      flex: 1;
      border-radius: 2px;
      background: #2a3344;
      transition: background 0.05s linear;
    }

    .actions {
      -webkit-app-region: no-drag;
      margin-top: auto;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      height: 36px;
      padding: 0 10px;
      color: var(--text);
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .action-btn:active { transform: scale(0.98); }

    .action-btn:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    #recordBtn,
    #stopBtn {
      background: var(--accent);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    #recordBtn { flex: 1.2; }
    #recordBtn:hover,
    #stopBtn:hover { background: var(--accent-hover); }
    #recordBtn:active,
    #stopBtn:active { background: var(--accent-press); }

    #cancelBtn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
    }

    #cancelBtn:hover { background: rgba(255, 255, 255, 0.06); }

    #stopBtn {
      display: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="drag" aria-hidden="true">
      <div class="drag-grip"></div>
    </div>

    <div class="status">
      <div class="ready-label" id="readyLabel">Ready</div>
      <div class="rec-indicator" id="recIndicator" style="display:none">
        <div class="dot"></div>
        <span>REC</span>
      </div>
      <div id="timer" style="display:none">00:00</div>
    </div>

    <div class="audio-card">
      <button id="micBtn" title="Toggle microphone" type="button">
        <svg id="micOn" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <svg id="micOff" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="mic-picker">
        <div class="mic-select-wrap">
          <select id="micSelect" title="Choose microphone" aria-label="Microphone">
            <option value="">Default microphone</option>
          </select>
        </div>
        <div class="meter" id="meter"></div>
      </div>
    </div>

    <div class="actions">
      <div class="btn-row" id="preRecordBtns">
        <button id="cancelBtn" class="action-btn" type="button">Cancel</button>
        <button id="recordBtn" class="action-btn" type="button">Record</button>
      </div>
      <button id="stopBtn" class="action-btn" type="button">Stop</button>
    </div>
  </div>
  <script src="controls.js"></script>
</body>
</html>
